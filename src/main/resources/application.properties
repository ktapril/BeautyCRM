spring.application.name=BeautyCRM

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/beauty_crm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:beauty_crm_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.time-zone=Europe/Moscow

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_FROM:}
app.frontend-url=${FRONTEND_URL:http://localhost:5174}

app.jwt.secret=${JWT_SECRET}

app.owner.email=${OWNER_EMAIL:}
app.owner.password=${OWNER_PASSWORD:}
app.owner.name=${OWNER_NAME:Владелец}