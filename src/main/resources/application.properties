spring.application.name=BeautyCRM

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/beauty_crm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:beauty_crm_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.time-zone=Europe/Moscow
